name: Production release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Точный release ID с успешным полным staging"
        required: true
        type: string
      operation:
        description: "Продвижение или откат только API/PWA без downgrade БД"
        required: true
        default: promote
        type: choice
        options: [promote, rollback]

permissions:
  contents: read

concurrency:
  group: gym-production-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r contracts/requirements.txt
      - name: Проверить ручной запуск и успешный staging кандидата
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m infra.production_gate

  promote:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r contracts/requirements.txt
      - name: Проверить пакеты и выполнить production-операцию
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m infra.production_release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/production-plan.json
            .local/production-release.json
          retention-days: 7
          if-no-files-found: ignore
