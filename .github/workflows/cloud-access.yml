name: Cloud access

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение для проверки OIDC без деплоя"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      validation_target:
        description: "Ручная сборка рабочей ветки без облачного доступа"
        required: true
        default: release-bundle
        type: choice
        options: [release-bundle, migration-image]

permissions:
  contents: read

jobs:
  bootstrap-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.scope.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select infrastructure checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_scope.py detect --base "$BASE_SHA" --head "$HEAD_SHA"
      # Bootstrap/OIDC unit проверяются в Web checks / infra; здесь только выбор облачной проверки.

  oidc:
    needs: bootstrap-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.bootstrap-tests.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Проверить OIDC и изоляцию окружений
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_OTHER_FOLDER_ID: ${{ vars.YC_OTHER_FOLDER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
          YC_OIDC_AUDIENCE: ${{ vars.YC_OIDC_AUDIENCE }}
          GYM_ENVIRONMENT: ${{ vars.GYM_ENVIRONMENT }}
        run: python3 infra/verify_oidc.py

  migration-image-validation:
    # Ручная проверка рабочей ветки: нет Environment, OIDC и публикации.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.validation_target == 'migration-image'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/build_worker_image.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: migration-image-validation
          path: .local/migration-image/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  release-bundle-validation:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.validation_target == 'release-bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check -r db/requirements.txt
      - run: python -m unittest discover -s tests/release -p 'test_*.py' -v
      - run: python -m infra.release_bundle --output-directory .local/release-validation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-bundle-validation
          path: .local/release-validation/bundle/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
