name: Web checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      contracts: ${{ steps.paths.outputs.contracts }}
      api: ${{ steps.paths.outputs.api }}
      ydb: ${{ steps.paths.outputs.ydb }}
      infra: ${{ steps.paths.outputs.infra }}
      web: ${{ steps.paths.outputs.web }}
      smoke: ${{ steps.paths.outputs.smoke }}
      plan: ${{ steps.paths.outputs.plan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed components
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/check_scope.py detect --full --plan-file .local/check-plan.json
          else
            if [[ "$EVENT_NAME" == pull_request ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            python3 scripts/check_scope.py detect --base "$BASE_SHA" --head "$HEAD_SHA" --plan-file .local/check-plan.json
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push'
        with:
          name: check-plan
          path: .local/check-plan.json
          retention-days: 7
          if-no-files-found: error
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r contracts/requirements.txt
      - run: python -m contracts.generate --check
      - run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/runtime-requirements.txt
            contracts/requirements.txt
            db/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r db/requirements.txt
      - run: python -m unittest discover -s tests/api -p 'test_*.py' -v
      - run: python scripts/build_api.py --smoke
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: db/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r db/requirements.txt
      - run: python -m unittest discover -s tests/infra -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/build -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/release -p 'test_*.py' -v
  ydb:
    needs: changes
    if: needs.changes.outputs.ydb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      ydb:
        # Официальный local-ydb 26.2.1.14; отдельная БД каждого job.
        image: ydbplatform/local-ydb@sha256:9e46fd45875551a75bcf34d0bb9ca0baa1d8763a4ccf2070af45f4467c4b7402
        ports:
          - 2136:2136
        options: --hostname localhost --health-interval 10s --health-timeout 10s --health-retries 18
    env:
      GYM_YDB_ENDPOINT: grpc://127.0.0.1:2136
      GYM_YDB_DATABASE: /local
      GYM_YDB_AUTH: anonymous
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/runtime-requirements.txt
            contracts/requirements.txt
            db/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r db/requirements.txt
      - run: python -m unittest discover -s tests/ydb -p 'test_*.py' -v
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node ../tests/contracts/canonical-vectors.mjs
      - name: Two critical UI scenarios in preinstalled Chrome
        if: needs.changes.outputs.smoke == 'true'
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: ui-smoke-failure
          path: web/test-results/
          retention-days: 3
  browser:
    needs: [changes, web]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          # pip из host toolcache ссылается на путь вне контейнера; запускай python -m pip без cache action.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r ../db/requirements.txt
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure
          path: web/test-results/
          retention-days: 3
  checks:
    if: always()
    needs: [changes, contracts, api, ydb, infra, web, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          GYM_CHECK_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_scope.py verify
